[project]
name = "pdi-lab"
version = "1.0.0"
description = "Laboratório M1.2 - transformações de intensidade"
requires-python = ">=3.10"
dependencies = ["pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]
